name: AstroWorld Phase 9 Convergence

on:
  push:
    branches:
      - astroworld/production-convergence-phase9-security
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  phase9-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm --workspace=@astroworld/frontend run build

      - name: Build backend
        run: npm --workspace=@astroworld/backend run build

      - name: Phase 9 all gates
        run: npm --workspace=@astroworld/backend run test:phase9:all
