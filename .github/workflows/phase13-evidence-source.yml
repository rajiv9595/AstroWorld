name: AstroWorld Phase 13 Evidence Source Hardening

on:
  push:
    branches:
      - astroworld/production-certification-v2
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'shared/**'
      - '.github/workflows/phase13-evidence-source.yml'

jobs:
  phase13-evidence-source:
    name: phase13-evidence-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backend build
        run: npm --workspace=@astroworld/backend run build
      - name: Phase 13 evidence/source hardening
        run: npm --workspace=@astroworld/backend run test:phase13:evidence-source
      - name: Phase 12 independent lunar reference
        run: npm --workspace=@astroworld/backend run test:phase12:independent-lunar
      - name: Full inherited Phase 1-9 precision/security regression
        run: npm --workspace=@astroworld/backend run test:phase9:all
      - name: AI V2 precision regression
        run: npm --workspace=@astroworld/backend run test:ai-v2-precision
      - name: Phase 10 calculation truth
        run: npm --workspace=@astroworld/backend run test:phase10:calculation-truth
      - name: Phase 10 source integrity
        run: npm --workspace=@astroworld/backend run test:phase10:source-integrity
      - name: Phase 10 audit repair
        run: npm --workspace=@astroworld/backend run test:phase10:audit-repair
