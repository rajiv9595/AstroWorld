name: AstroWorld Phase 10 Astrology Correctness

on:
  push:
    branches:
      - astroworld/phase10-astrology-correctness
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  phase10-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm --workspace=@astroworld/frontend run build

      - name: Build backend
        run: npm --workspace=@astroworld/backend run build

      - name: Phase 10 calculation truth
        run: npm --workspace=@astroworld/backend run test:phase10:calculation-truth

      - name: Phase 10 classical source integrity
        run: npm --workspace=@astroworld/backend run test:phase10:source-integrity

      - name: Phase 9 + precision regression
        run: npm --workspace=@astroworld/backend run test:phase9:all
